[project]
name = "wikeds"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jivesh866", email = "jiveshbisht.123@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.1",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
]

[project.scripts]
wikeds-run = "wikeds.run_all:main"
wikeds-listener = "wikeds.listener:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
